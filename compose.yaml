services:

  mysql:
    image: mysql:8.0
    container_name: mcp-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    networks:
      - mcp-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  mongodb:
    image: mongo:8.0
    container_name: mcp-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

      # Se pasan al init.js para crear el usuario de aplicación
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./db/mongodb/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
      - ./db/mongodb/seed.js:/docker-entrypoint-initdb.d/02-seed.js:ro

    networks:
      - mcp-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet \
          --username \"$$MONGO_INITDB_ROOT_USERNAME\" \
          --password \"$$MONGO_INITDB_ROOT_PASSWORD\" \
          --authenticationDatabase admin \
          --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama
    
    networks:
      - mcp-network

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  mcp-server:
    build:
      context: ./mcp
      dockerfile: src/MCP.Server/Dockerfile
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      MySql__Server: mysql
      MySql__Port: "3306"
      MySql__Database: ${MYSQL_DATABASE}
      MySql__User: ${MYSQL_USER}
      MySql__Password: ${MYSQL_PASSWORD}
      MongoDb__Server: mongodb
      MongoDb__Port: "27017"
      MongoDb__Database: ${MONGO_DATABASE}
      MongoDb__User: ${MONGO_USER}
      MongoDb__Password: ${MONGO_PASSWORD}
      MongoDb__AuthenticationDatabase: ${MONGO_DATABASE}

    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    networks:
      - mcp-network

  agent:
    build:
      context: ./mcp
      dockerfile: src/Agent/Dockerfile
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Mcp__ServerUrl: http://mcp-server:5000/mcp
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: qwen3:8b

    ports:
      - "5062:5000"

    depends_on:
      mcp-server:
        condition: service_started
      ollama:
        condition: service_started

    networks:
      - mcp-network

volumes:

  mysql_data:
    name: mcp_mysql_data

  mongodb_data:
    name: mcp_mongodb_data

  ollama_data:
    name: mcp_ollama_data

networks:

  mcp-network:
    name: mcp-network
    driver: bridge